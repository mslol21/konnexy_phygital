<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1208" />
      <stop offset="50%" stop-color="#0f0b07" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#b45309" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <pattern id="pinstripe" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
